openapi: 3.1.0
info:
  title: IIM Lucknow Sports Operations API
  version: 1.0.0
  description: Backend contract for venue/equipment booking, approvals, sports content, reporting, and administration.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: Public
  - name: Bookings
  - name: Approvals
  - name: Resources
  - name: Sports Content
  - name: Administration
paths:
  /health:
    get:
      tags: [Public]
      security: []
      summary: Service health
      responses:
        '200': { description: Healthy }
  /auth/config:
    get:
      tags: [Public]
      security: []
      summary: Public signup eligibility configuration
      responses:
        '200': { description: Active email rule and fixed administrator email }
  /auth/signup:
    post:
      tags: [Public]
      security: []
      summary: Register an eligible email/password account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, format: password }
      responses:
        '201': { description: Account and session created }
        '403': { description: Email is not eligible }
  /auth/login:
    post:
      tags: [Public]
      security: []
      summary: Sign in with an eligible registered account
      responses:
        '200': { description: User and session token }
        '401': { description: Invalid credentials }
  /auth/logout:
    post:
      tags: [Public]
      summary: Revoke the current session
      responses:
        '204': { description: Session revoked }
  /public/venues:
    get:
      tags: [Public]
      security: []
      summary: List active public venues
      parameters:
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: q, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /public/equipment:
    get:
      tags: [Public]
      security: []
      summary: List active public equipment
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /public/availability:
    get:
      tags: [Public]
      security: []
      summary: Privacy-safe occupied slots, blackouts, and live holds
      description: >-
        `data` lists occupied bookings and is unchanged. `blackouts` and `holds`
        are additive, and exist so the booking calendar can grey out slots a
        student would otherwise only learn about after trying to book.
        Holds are anonymised: they never carry `heldBy`.
      parameters:
        - { in: query, name: resourceType, required: true, schema: { $ref: '#/components/schemas/ResourceType' } }
        - { in: query, name: resourceId, schema: { type: string, format: uuid } }
        - { in: query, name: from, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: to, required: true, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Occupied slots, plus the blackout and hold layers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PublicBooking' } }
                  blackouts: { type: array, items: { $ref: '#/components/schemas/PublicBlackout' } }
                  holds: { type: array, items: { $ref: '#/components/schemas/PublicHold' } }
  /public/holds:
    get:
      tags: [Public, Bookings]
      security: []
      summary: Live slot holds, anonymised (US-04B)
      description: >-
        Slots another person is currently holding. Deliberately omits `heldBy`,
        so the calendar can show that a slot is spoken for without revealing who
        is taking it.
      parameters:
        - { in: query, name: resourceType, required: true, schema: { $ref: '#/components/schemas/ResourceType' } }
        - { in: query, name: resourceId, schema: { type: string, format: uuid } }
        - { in: query, name: from, schema: { type: string, format: date-time } }
        - { in: query, name: to, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Active holds
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/PublicHold' } }
                  meta:
                    type: object
                    properties:
                      ttlMinutes: { type: integer, example: 5 }
        '400': { $ref: '#/components/responses/ErrorResponse' }
  /public/recommendations:
    get:
      tags: [Public, Bookings]
      security: []
      summary: Alternative slots when a time is unavailable (US-05B)
      description: >-
        A transparent rule-based heuristic, not a model. Peak windows are
        06:00-09:00 and 17:00-21:00 IST; a peak-blocked request is answered with
        off-peak slots first. Suggestions keep the requested duration exactly,
        rank same-day first, and never overlap a booking, blackout, or live hold.
        An empty `data` array is a valid answer, not an error - clients should
        render the explanation in `meta.reason` (US-05D).
      parameters:
        - { in: query, name: resourceType, required: true, schema: { $ref: '#/components/schemas/ResourceType' } }
        - { in: query, name: resourceId, required: true, schema: { type: string, format: uuid } }
        - { in: query, name: startAt, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: endAt, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: limit, schema: { type: integer, default: 3, maximum: 10 } }
        - { in: query, name: windowDays, schema: { type: integer, default: 7, maximum: 30 } }
      responses:
        '200':
          description: Ranked alternatives, best first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/SlotSuggestion' } }
                  meta:
                    type: object
                    properties:
                      requestedPeak: { type: boolean }
                      windowDays: { type: integer }
                      reason: { type: string }
        '400': { $ref: '#/components/responses/ErrorResponse' }
  /public/{contentType}:
    get:
      tags: [Public]
      security: []
      summary: List public committee, gallery, tournament, match, or standings content
      parameters:
        - in: path
          name: contentType
          required: true
          schema: { type: string, enum: [committee, gallery, tournaments, matches, standings] }
        - { in: query, name: tournamentId, schema: { type: string, format: uuid } }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /me:
    get:
      summary: Current user profile
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
  /venues:
    get:
      tags: [Resources]
      summary: Search venues
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Resources]
      summary: Create venue (admin)
      requestBody: { $ref: '#/components/requestBodies/Venue' }
      responses:
        '201': { $ref: '#/components/responses/ItemResponse' }
  /venues/{id}:
    get:
      tags: [Resources]
      summary: Get venue
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
    patch:
      tags: [Resources]
      summary: Update venue (admin)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Venue' }
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
    delete:
      tags: [Resources]
      summary: Deactivate venue (admin)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
  /equipment:
    get:
      tags: [Resources]
      summary: Search equipment
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Resources]
      summary: Create equipment item (admin)
      requestBody: { $ref: '#/components/requestBodies/Equipment' }
      responses:
        '201': { $ref: '#/components/responses/ItemResponse' }
  /equipment/{id}:
    get:
      tags: [Resources]
      summary: Get equipment item
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
    patch:
      tags: [Resources]
      summary: Update equipment item (admin)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      requestBody: { $ref: '#/components/requestBodies/Equipment' }
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
    delete:
      tags: [Resources]
      summary: Deactivate equipment item (admin)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
  /bookings:
    get:
      tags: [Bookings]
      summary: List the current user's bookings (admin can list all)
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Bookings]
      summary: Instantly confirm an available venue booking; legacy equipment bookings may require approval
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BookingInput' }
      responses:
        '201': { $ref: '#/components/responses/ItemResponse' }
        '409': { $ref: '#/components/responses/ErrorResponse' }
  /bookings/{id}:
    get:
      tags: [Bookings]
      summary: Get an authorized booking
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
    patch:
      tags: [Bookings]
      summary: Edit a pending booking
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
  /bookings/{id}/cancel:
    post:
      tags: [Bookings]
      summary: Cancel an owned booking
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
  /holds:
    post:
      tags: [Bookings]
      summary: Hold a slot for five minutes while booking (US-04B)
      description: >-
        An advisory, short-lived claim taken when a student picks a slot on the
        calendar, so nobody else takes it while they fill in the form. A hold is
        never a booking; the booking, and the database exclusion constraint
        behind it, remain the source of truth. Holds expire passively - there is
        no sweeper job, so a lapsed hold stops blocking the moment it lapses.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HoldInput' }
      responses:
        '201':
          description: The hold, and the TTL the UI should count down from
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Hold' }
                  meta:
                    type: object
                    properties:
                      ttlMinutes: { type: integer, example: 5 }
        '409':
          description: Someone else booked, blacked out, or is already holding that slot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /holds/mine:
    get:
      tags: [Bookings]
      summary: My live holds, for recovering after a page refresh (US-04B)
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /holds/{id}:
    delete:
      tags: [Bookings]
      summary: Release a hold early (owner or admin)
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
        '403': { $ref: '#/components/responses/ErrorResponse' }
  /approvals/pending:
    get:
      tags: [Approvals]
      summary: Current approver queue
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /approvals/{bookingId}/decision:
    post:
      tags: [Approvals]
      summary: Approve or reject the current sequential step
      parameters:
        - { in: path, name: bookingId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [approve, reject] }
                comment: { type: string, maxLength: 2000 }
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
  /{contentType}:
    get:
      tags: [Sports Content]
      summary: List managed sports content
      parameters:
        - in: path
          name: contentType
          required: true
          schema: { type: string, enum: [committee, gallery, tournaments, matches, standings] }
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Sports Content]
      summary: Create sports content (admin; scorekeeper also allowed for matches and standings)
      parameters:
        - in: path
          name: contentType
          required: true
          schema: { type: string, enum: [committee, gallery, tournaments, matches, standings] }
      responses:
        '201': { $ref: '#/components/responses/ItemResponse' }
  /{contentType}/{id}:
    patch:
      tags: [Sports Content]
      summary: Update sports content
      parameters:
        - in: path
          name: contentType
          required: true
          schema: { type: string, enum: [committee, gallery, tournaments, matches, standings] }
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
    delete:
      tags: [Sports Content]
      summary: Delete sports content (admin; scorekeeper also allowed for matches and standings)
      parameters:
        - in: path
          name: contentType
          required: true
          schema: { type: string, enum: [committee, gallery, tournaments, matches, standings] }
        - { $ref: '#/components/parameters/Id' }
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
  /admin/users:
    get:
      tags: [Administration]
      summary: List users
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /admin/users/{id}/role:
    patch:
      tags: [Administration]
      summary: Change a user's role
      parameters: [{ $ref: '#/components/parameters/Id' }]
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
  /admin/auth-settings:
    get:
      tags: [Administration]
      summary: Read the active email eligibility rule
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
    put:
      tags: [Administration]
      summary: Replace the signup and login email regular expression
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
  /admin/role-assignments:
    get:
      tags: [Administration]
      summary: List explicit non-student role assignments
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Administration]
      summary: Assign a role by email, including before signup
      responses:
        '201': { $ref: '#/components/responses/ItemResponse' }
  /admin/role-assignments/{email}:
    delete:
      tags: [Administration]
      summary: Remove an explicit role and restore the Student default
      parameters:
        - { in: path, name: email, required: true, schema: { type: string, format: email } }
      responses:
        '204': { description: Assignment removed }
  /admin/approval-flows:
    get:
      tags: [Administration]
      summary: List approval flows
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Administration]
      summary: Create an ordered approval flow
      responses:
        '201': { $ref: '#/components/responses/ItemResponse' }
  /admin/blackouts:
    get:
      tags: [Administration]
      summary: List blocked periods
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
    post:
      tags: [Administration]
      summary: Block a period from booking
      responses:
        '201': { $ref: '#/components/responses/ItemResponse' }
  /admin/reports/utilization:
    get:
      tags: [Administration]
      summary: Booking and booked-hour utilization
      parameters:
        - { in: query, name: from, required: true, schema: { type: string, format: date-time } }
        - { in: query, name: to, required: true, schema: { type: string, format: date-time } }
      responses:
        '200': { $ref: '#/components/responses/ItemResponse' }
  /admin/audit-log:
    get:
      tags: [Administration]
      summary: Read append-only audit history
      responses:
        '200': { $ref: '#/components/responses/ListResponse' }
  /account/password-changed:
    post:
      tags: [Administration]
      summary: Clear the first-login password-change gate after Supabase Auth updateUser succeeds
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /equipment-module/sports:
    get:
      tags: [Resources]
      summary: List sports and their POCs
      responses: { '200': { $ref: '#/components/responses/ListResponse' } }
  /equipment-module/teams:
    get:
      tags: [Resources]
      summary: List sports teams and captains
      responses: { '200': { $ref: '#/components/responses/ListResponse' } }
  /equipment-module/requests:
    get:
      tags: [Resources]
      summary: List visible equipment requests
      responses: { '200': { $ref: '#/components/responses/ListResponse' } }
    post:
      tags: [Resources]
      summary: Create a casual, team, or return equipment request
      responses: { '201': { $ref: '#/components/responses/ItemResponse' } }
  /equipment-module/requests/{id}/decision:
    post:
      tags: [Approvals]
      summary: Approve or reject an equipment request through its dedicated workflow
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /equipment-module/requests/{id}/qr:
    post:
      tags: [Resources]
      summary: Generate or regenerate a signed expiring equipment QR token
      responses: { '201': { $ref: '#/components/responses/ItemResponse' } }
  /equipment-module/kiosk/inspect:
    post:
      tags: [Resources]
      summary: Validate a request QR and list the physical tags required for tracked items
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /equipment-module/kiosk/confirm:
    post:
      tags: [Resources]
      summary: Validate exact asset scans, atomically change custody, and consume the request token
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /equipment-module/audit:
    get:
      tags: [Administration]
      summary: Filter equipment custody state changes
      responses: { '200': { $ref: '#/components/responses/ListResponse' } }
  /public/equipment-catalog:
    get:
      tags: [Resources]
      summary: List live sports (and shared campus locations used by venues)
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /equipment-module/inventory:
    get:
      tags: [Resources]
      summary: Show sport-grouped allocation and custody quantities
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /equipment-module/inventory/{id}/transfer:
    post:
      tags: [Administration]
      summary: Allocate in-store stock or record a reasoned manual custody correction
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /equipment-module/inventory/{id}/resolve:
    post:
      tags: [Administration]
      summary: Restore damaged or missing inventory, or write it off
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /admin/sports:
    post:
      tags: [Administration]
      summary: Create a sport
      responses: { '201': { $ref: '#/components/responses/ItemResponse' } }
  /admin/campus-locations:
    post:
      tags: [Administration]
      summary: Add a shared campus location
      responses: { '201': { $ref: '#/components/responses/ItemResponse' } }
  /admin/campus-locations/{id}:
    patch:
      tags: [Administration]
      summary: Rename or activate/deactivate a campus location
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /admin/inventory-kiosk:
    post:
      tags: [Administration]
      summary: Create the one-time inventory kiosk Supabase Auth account
      responses: { '201': { $ref: '#/components/responses/ItemResponse' } }
  /admin/equipment/{id}/assets:
    post:
      tags: [Administration]
      summary: Register asset tags or serial numbers for tracked equipment
      responses: { '201': { $ref: '#/components/responses/ListResponse' } }
  /admin/sports/{id}:
    patch:
      tags: [Administration]
      summary: Rename or activate/deactivate a sport
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /admin/sports/{id}/pocs:
    put:
      tags: [Administration]
      summary: Assign primary and secondary SportComm POCs
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /admin/sports/{id}/captain:
    put:
      tags: [Administration]
      summary: Assign an existing Student account as the captain for a sport by email
      parameters:
        - { $ref: '#/components/parameters/Id' }
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /admin/teams:
    post:
      tags: [Administration]
      summary: Create a team and assign its captain
      responses: { '201': { $ref: '#/components/responses/ItemResponse' } }
  /admin/teams/{id}:
    patch:
      tags: [Administration]
      summary: Update a team, captain, members, or active state
      responses: { '200': { $ref: '#/components/responses/ItemResponse' } }
  /jobs/reminders:
    get:
      tags: [Administration]
      summary: Dispatch due notification outbox items (Vercel Cron)
      responses:
        '200': { description: Dispatch result }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string }
  schemas:
    ResourceType: { type: string, enum: [venue, equipment] }
    VenueInput:
      type: object
      required: [name, sportId, location]
      properties:
        name: { type: string }
        sportId: { type: [string, 'null'], format: uuid }
        category: { type: string, deprecated: true, default: Sports venue }
        location: { type: [string, 'null'] }
        locationId: { type: [string, 'null'], format: uuid }
        photoPath: { type: [string, 'null'] }
        capacity: { type: integer, minimum: 1, deprecated: true, default: 1 }
        amenities: { type: array, items: { type: string }, deprecated: true }
        rules: { type: object, additionalProperties: true }
        active: { type: boolean }
    EquipmentInput:
      type: object
      required: [name, sportId, quantity]
      properties:
        name: { type: string }
        sportId: { type: string, format: uuid }
        photoPath: { type: [string, 'null'] }
        quantity: { type: integer, minimum: 1 }
        tracking: { type: string, enum: [BULK, ASSET] }
        metadata: { type: object, additionalProperties: true }
        active: { type: boolean }
    BookingInput:
      type: object
      required: [resourceType, resourceId, title, startAt, endAt]
      properties:
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        resourceId: { type: string, format: uuid }
        title: { type: string, maxLength: 160 }
        purpose: { type: [string, 'null'] }
        quantity: { type: integer, minimum: 1, default: 1 }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
        holdId:
          type: string
          format: uuid
          description: >-
            Optional (US-04B). The hold being converted into this booking. Must
            belong to the caller, still be live, and cover this exact slot.
            Omitting it books normally, so clients without slot-lock support are
            unaffected.
    HoldInput:
      type: object
      required: [resourceType, resourceId, startAt, endAt]
      properties:
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        resourceId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        quantity: { type: integer, minimum: 1, default: 1 }
    Hold:
      type: object
      properties:
        id: { type: string, format: uuid }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        resourceId: { type: string, format: uuid }
        heldBy: { type: string }
        quantity: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        releasedAt: { type: [string, 'null'], format: date-time }
        bookingId: { type: [string, 'null'], format: uuid }
    PublicHold:
      type: object
      description: A hold as seen by everyone else - no `heldBy`.
      properties:
        id: { type: string, format: uuid }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        resourceId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    PublicBooking:
      type: object
      description: An occupied slot - no requester, title, purpose, or metadata.
      properties:
        id: { type: string, format: uuid }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        resourceId: { type: string, format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { type: string }
    PublicBlackout:
      type: object
      properties:
        id: { type: string, format: uuid }
        resourceType: { $ref: '#/components/schemas/ResourceType' }
        resourceId: { type: [string, 'null'], format: uuid }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        reason: { type: string }
    SlotSuggestion:
      type: object
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        score: { type: number, description: Higher is better. Ranking only - not meaningful on its own. }
        peak: { type: boolean }
        reasons:
          type: array
          items: { type: string }
          description: Plain-English justifications, e.g. "Same day", "Off-peak - quieter and usually approved faster".
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: {}
            requestId: { type: string, format: uuid }
  requestBodies:
    Venue:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/VenueInput' } } }
    Equipment:
      required: true
      content: { application/json: { schema: { $ref: '#/components/schemas/EquipmentInput' } } }
  responses:
    ItemResponse:
      description: One resource
      content:
        application/json:
          schema:
            type: object
            properties: { data: {} }
    ListResponse:
      description: Resource list
      content:
        application/json:
          schema:
            type: object
            properties:
              data: { type: array, items: {} }
    ErrorResponse:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
